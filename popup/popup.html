<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Pinterest Comfort Themes</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Tema</h1>
  <div class="themes" role="group" aria-label="Tema">
    <button type="button" data-theme="light" aria-pressed="false"><span class="swatch" style="background:#ffffff"></span>Claro</button>
    <button type="button" data-theme="dark" aria-pressed="false"><span class="swatch" style="background:#2e2e2e"></span>Escuro</button>
    <button type="button" data-theme="sepia" aria-pressed="false"><span class="swatch" style="background:#f4ecd8"></span>Sépia</button>
  </div>
  <label class="other"><input type="checkbox" id="other-sites"> Aplicar em outros sites</label>
  <script src="../src/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
