<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Soft Themes for Pinterest</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <p class="label" data-i18n="popupTitle">Theme</p>
  <div class="themes" role="group" data-i18n-aria="popupTitle">
    <button type="button" data-theme="light" aria-pressed="false"><span class="swatch light"></span><span data-i18n="themeLight">Light</span></button>
    <button type="button" data-theme="dark" aria-pressed="false"><span class="swatch dark"></span><span data-i18n="themeDark">Dark</span></button>
    <button type="button" data-theme="sepia" aria-pressed="false"><span class="swatch sepia"></span><span data-i18n="themeSepia">Sepia</span></button>
  </div>
  <label class="other"><input type="checkbox" id="other-sites"> <span data-i18n="otherSites">Apply to other sites</span></label>
  <p id="status" class="status" role="status"></p>
  <script src="../src/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
